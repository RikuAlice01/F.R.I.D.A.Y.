<!doctype html>
<!-- §104 FRIDAY's storyboard player: motion graphics in CSS + JS, every frame a pure function of time (window.T(t)),
     after the /brag skill (github.com/latent-spaces/brag, MIT). video.py injects the storyboard as SB and captures each
     frame in Edge headless. Text from the model goes in with textContent only. -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: P; src: url(/__friday/fonts/Prompt-Regular.ttf); font-weight: 400; }
@font-face { font-family: P; src: url(/__friday/fonts/Prompt-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: P; src: url(/__friday/fonts/Prompt-Bold.ttf); font-weight: 700; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
  font-family: P, "Leelawadee UI", Tahoma, sans-serif; }
#bg, .scene { position: absolute; inset: 0; }
.blob { position: absolute; border-radius: 50%; filter: blur(calc(var(--u) * 9)); opacity: .35; }
.scene { display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  padding: calc(var(--u) * 8); gap: calc(var(--u) * 3); }
.big, .line, .quote, .sub { text-wrap: balance; }
.big { font-weight: 700; font-size: calc(var(--u) * 11); line-height: 1.15; letter-spacing: -.01em; }
.grad { background: linear-gradient(100deg, var(--a1), var(--a2), var(--a3)); -webkit-background-clip: text;
  background-clip: text; color: transparent; padding-bottom: .08em; }
.sub { font-size: calc(var(--u) * 4.2); color: var(--mute); font-weight: 400; max-width: 90%; }
.line { font-size: calc(var(--u) * 6.4); font-weight: 600; line-height: 1.3; }
.cards { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u) * 2.4); max-width: 94%; }
.card { background: var(--card); border-radius: calc(var(--u) * 2.4); padding: calc(var(--u) * 2.4) calc(var(--u) * 3.6);
  font-size: calc(var(--u) * 4.4); font-weight: 600; box-shadow: 0 calc(var(--u) * .8) calc(var(--u) * 3) rgba(0,0,0,.12); }
.card::before { content: ""; display: inline-block; width: .5em; height: .5em; border-radius: 50%; margin-right: .5em;
  vertical-align: .12em; background: linear-gradient(135deg, var(--a1), var(--a3)); }
.num { font-weight: 700; font-size: calc(var(--u) * 24); line-height: 1; }
.mark { font-family: Georgia, serif; font-size: calc(var(--u) * 26); line-height: .9; font-weight: 700; height: calc(var(--u) * 9); }
.quote { font-size: calc(var(--u) * 6.2); font-weight: 600; line-height: 1.35; max-width: 92%; }
.img { position: absolute; inset: 0; background-size: cover; background-position: center; }
.shade { position: absolute; inset: 0; background: linear-gradient(transparent 45%, rgba(0,0,0,.72)); }
.cap { position: absolute; left: 0; right: 0; bottom: calc(var(--u) * 9); padding: 0 calc(var(--u) * 7); color: #fff; }
.cap .line { text-shadow: 0 2px 12px rgba(0,0,0,.4); }
.cap .sub { color: rgba(255,255,255,.85); margin: calc(var(--u) * 1.5) auto 0; }
.orb { width: calc(var(--u) * 14); height: calc(var(--u) * 14); border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff8, transparent 45%), linear-gradient(135deg, var(--a1), var(--a2), var(--a3)); }
.pill { font-size: calc(var(--u) * 3.6); font-weight: 600; padding: calc(var(--u) * 1.2) calc(var(--u) * 3.4); border-radius: 999px;
  background: var(--ink); color: var(--bg); }
.caps .big, .caps .line, .caps .card { text-transform: uppercase; }
/* §106 infographics */
.chart { width: 84%; display: flex; flex-direction: column; gap: calc(var(--u) * 1.8); }
.brow { display: flex; align-items: center; gap: calc(var(--u) * 2); font-size: calc(var(--u) * 4.4); font-weight: 600; }
.blabel { width: 28%; text-align: right; }
.btrack { flex: 1; height: calc(var(--u) * 4.4); background: var(--card); border-radius: 999px; overflow: hidden; }
.bar { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--a1), var(--a2), var(--a3)); }
.bval { width: 18%; text-align: left; font-weight: 700; }
.bval { white-space: nowrap; }
.vert .chart { width: 86%; gap: calc(var(--u) * 3); }
.vert .brow { display: grid; grid-template-columns: 1fr auto; row-gap: calc(var(--u) * 1); }
.vert .blabel { grid-column: 1 / 3; width: auto; text-align: left; } .vert .bval { width: auto; }
.donut { display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 6); }
.vert .donut { flex-direction: column; gap: calc(var(--u) * 3); }
.dwrap { position: relative; width: calc(var(--u) * 46); height: calc(var(--u) * 46); }
.dwrap svg { width: 100%; height: 100%; }
.dcenter { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 700;
  font-size: calc(var(--u) * 9); }
.legend { display: flex; flex-direction: column; gap: calc(var(--u) * 1.6); text-align: left; font-size: calc(var(--u) * 4.4); font-weight: 600; }
.dot { display: inline-block; width: .7em; height: .7em; border-radius: 50%; margin-right: .5em; vertical-align: .05em; }
.linebox { position: relative; width: 84%; margin-bottom: calc(var(--u) * 5); }
.linebox svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.vlab, .xlab { position: absolute; transform: translate(-50%, -150%); font-weight: 700; font-size: calc(var(--u) * 4); white-space: nowrap; }
.xlab { transform: translate(-50%, 40%); color: var(--mute); font-weight: 600; font-size: calc(var(--u) * 3.2); }
.steps { position: relative; display: flex; width: 92%; }
.step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 1.4); z-index: 1; padding: 0 calc(var(--u) * .8); }
.dotn { width: calc(var(--u) * 8); height: calc(var(--u) * 8); border-radius: 50%; display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: calc(var(--u) * 3.8); background: linear-gradient(135deg, var(--a1), var(--a3)); flex: none; }
.when { font-size: calc(var(--u) * 3.4); color: var(--mute); font-weight: 600; }
.slabel { font-size: calc(var(--u) * 4.2); font-weight: 600; line-height: 1.3; }
.rail { position: absolute; top: calc(var(--u) * 4 - 3px); height: 6px; background: var(--card); border-radius: 3px; }
.railfill { width: 0; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--a1), var(--a3)); }
.vert .steps { flex-direction: column; width: 80%; gap: calc(var(--u) * 3); }
.vert .step { flex-direction: row; text-align: left; gap: calc(var(--u) * 3); }
.vert .rail { top: auto; left: calc(var(--u) * 4.8 - 3px); width: 6px; height: auto; }
.vert .railfill { width: 100%; height: 0; background: linear-gradient(180deg, var(--a1), var(--a3)); }
.icons { display: grid; gap: calc(var(--u) * 2.4); width: 90%; }
.icon { background: var(--card); border-radius: calc(var(--u) * 3); padding: calc(var(--u) * 3) calc(var(--u) * 2);
  display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 1.4); box-shadow: 0 calc(var(--u) * .8) calc(var(--u) * 3) rgba(0,0,0,.1); }
.emoji { font-family: "Segoe UI Emoji", sans-serif; font-size: calc(var(--u) * 10); line-height: 1.1; }
.ilabel { font-size: calc(var(--u) * 4); font-weight: 600; }
.ring { position: relative; width: calc(var(--u) * 52); height: calc(var(--u) * 52); display: flex; align-items: center; justify-content: center; }
.ring svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.ring .num { font-size: calc(var(--u) * 15); }
/* §107 story shots (video_story.js) */
.shotscene, .endcard { padding: 0; }
.world { position: absolute; inset: 0; width: 100%; height: 100%; }
.caption { position: absolute; left: 6%; right: 6%; bottom: 10%; text-align: center; color: #fff; font-weight: 700;
  font-size: calc(var(--u) * 4.6); line-height: 1.5; text-shadow: 0 2px 6px rgba(0,0,0,.85), 0 0 2px #000; }
.vert .caption { bottom: 19%; }
.capshade { position: absolute; left: 0; right: 0; bottom: 0; height: 42%; background: linear-gradient(transparent, rgba(0,0,0,.5)); }
.c-yellow, .c-speaker { color: #ffd23f; }
.c-red { background: #e0393e; color: #fff; padding: 0 .3em; border-radius: .18em; text-shadow: none; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.caption.c-simple { left: 50%; right: auto; transform: translateX(-50%); max-width: 88%; background: rgba(0,0,0,.55); padding: .25em .7em; border-radius: .4em; }
.badge { position: absolute; top: 7%; left: 6%; background: #fff; color: #222; border-radius: .5em; padding: .15em .6em;
  font-weight: 700; font-size: calc(var(--u) * 3.2); box-shadow: 0 2px 8px rgba(0,0,0,.4); }
.endcard { background: #07080c; color: #fff; }
.end-title { font-size: calc(var(--u) * 9); font-weight: 700; line-height: 1.25; max-width: 86%; }
.end-sub { color: #ff5a5f; font-size: calc(var(--u) * 3.6); font-weight: 600; }
.end-bar { height: 6px; width: 0; background: #e0393e; box-shadow: 0 0 18px #e0393e; border-radius: 3px; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#bars { position: absolute; inset: 0; pointer-events: none; }
#bars::before, #bars::after { content: ""; position: absolute; left: 0; right: 0; height: var(--bar, 0); background: #000; }
#bars::before { top: 0; } #bars::after { bottom: 0; }
</style></head>
<body><div id="bg"></div><div id="stage"></div><div id="bars"></div><div id="flash"></div>
<script>
const SB = /*STORYBOARD*/{};
</script>
<script src="/__friday/story.js"></script>
<script>
// tone = colors + how scenes move (after the /brag tone table)
const TONES = {
  default:   { bg: "#ffffff", ink: "#1d1d1f", mute: "#6e6e73", card: "#f4f4f7", a: ["#00b8e6", "#6a5cff", "#c04fd8"], inT: .55, outT: .3, blob: 1 },
  polished:  { bg: "#f7f5f0", ink: "#1a1a1a", mute: "#77736a", card: "#ffffff", a: ["#1a1a1a", "#8a6d3b", "#b8975a"], inT: .9, outT: .5, blob: .5 },
  cinematic: { bg: "#07080c", ink: "#f4f1ea", mute: "#a9a59b", card: "#15171f", a: ["#f7d58b", "#e8a54b", "#c96b2c"], inT: 1.1, outT: .5, blob: .7, bars: true },
  chaotic:   { bg: "#fff200", ink: "#111111", mute: "#333333", card: "#ffffff", a: ["#ff1f6d", "#7a00ff", "#00c2ff"], inT: .18, outT: .08, blob: 1.6, caps: true, flash: true },
  deadpan:   { bg: "#ffffff", ink: "#111111", mute: "#8a8a8a", card: "#f2f2f2", a: ["#111111", "#111111", "#111111"], inT: 1.0, outT: .6, blob: 0 },
  "app-store": { bg: "#f2f3f7", ink: "#1d1d1f", mute: "#6e6e73", card: "#ffffff", a: ["#0a84ff", "#5e5ce6", "#bf5af2"], inT: .5, outT: .3, blob: .6 },
  dark:      { bg: "#0b0c11", ink: "#e8e8ee", mute: "#8a8fa3", card: "#16181f", a: ["#3ee6ff", "#6a5cff", "#ff4fd8"], inT: .55, outT: .3, blob: 1 },
};
const tone = Object.assign({}, TONES[SB.tone] || TONES.default);
if (SB.story) Object.assign(tone, { bg: "#07080c", blob: 0, inT: .4, outT: .3 });  // §107 a story is its own pictures
const C = SB.colors || {};
if (C.bg) tone.bg = C.bg; if (C.ink) tone.ink = C.ink; if (C.accent) tone.a = [C.accent, C.accent, tone.a[2]];
const root = document.documentElement.style;
root.setProperty("--bg", tone.bg); root.setProperty("--ink", tone.ink); root.setProperty("--mute", tone.mute);
root.setProperty("--card", tone.card);
tone.a.forEach((c, i) => root.setProperty("--a" + (i + 1), c));
root.setProperty("--u", Math.min(innerWidth, innerHeight) / 100 * (innerHeight > innerWidth ? 1.15 : 1) + "px");  // vertical: a phone held close
if (tone.caps) document.body.classList.add("caps");
const VERT = innerHeight > innerWidth;
if (VERT) document.body.classList.add("vert");

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);                       // out-cubic
const back = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
// Thai has no spaces between words, so the browser may break a name in two ("กาแฟดอย / ช้าง"): the writer's own spaces
// are the break points — each short chunk stays whole (text nodes only, never HTML)
const el = (tag, cls, text) => {
  const e = document.createElement(tag); if (cls) e.className = cls;
  if (text != null) for (const w of String(text).split(/(\s+)/)) {
    if (w && !/\s/.test(w) && w.length <= 16) { const k = document.createElement("span"); k.style.whiteSpace = "nowrap"; k.textContent = w; e.appendChild(k); }
    else if (w) e.appendChild(document.createTextNode(w));
  }
  return e;
};

// §106 infographics: SVG built node by node (no markup from the model), drawn by T(t) through e._f(progress)
const NS = "http://www.w3.org/2000/svg";
const svg = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const PALETTE = () => [tone.a[0], tone.a[1], tone.a[2], tone.ink, "#f5a623", "#34c759", "#ff6b6b", tone.mute];
const decs = (vals) => Math.min(2, Math.max(0, ...vals.map((v) => (String(v).split(".")[1] || "").length)));
const num = (v, d) => Number(v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const head = (n, parts, s) => { if (s.text) parts.push([n.appendChild(el("div", "line grad", s.text)), 0, "rise"]); };
const foot = (n, parts, s, at) => { if (s.sub) parts.push([n.appendChild(el("div", "sub", s.sub)), at, "rise"]); };

// background: soft blobs drifting as a function of t
const bg = document.getElementById("bg"), blobs = [];
for (let i = 0; i < 3; i++) {
  const b = el("div", "blob"); b.style.background = tone.a[i]; b.style.width = b.style.height = (38 + i * 10) + "vmax";
  if (!tone.blob) b.style.display = "none"; bg.appendChild(b); blobs.push(b);
}
if (tone.bars) document.getElementById("bars").style.setProperty("--bar", "9vh");

// build every scene once; T(t) only moves things
const stage = document.getElementById("stage"), scenes = [], images = [];
for (const s of SB.scenes) {
  const n = el("div", "scene"), parts = [];  // parts: [element, delay, kind]
  if (s.type === "title" || s.type === "outro") {
    if (s.type === "outro") parts.push([n.appendChild(el("div", "orb")), 0, "pop"]);
    parts.push([n.appendChild(el("div", "big grad", s.text)), .1, "rise"]);
    if (s.sub) parts.push([n.appendChild(el("div", "sub", s.sub)), .45, "rise"]);
    if (s.type === "outro" && s.items && s.items[0]) parts.push([n.appendChild(el("div", "pill", s.items[0])), .8, "pop"]);
  } else if (s.type === "lines") {
    const lines = [s.text, ...(s.items || [])].filter(Boolean);
    const step = Math.min(.9, (s.seconds * .55) / Math.max(1, lines.length));
    const lone = lines.length === 1;  // one line on its own: as big as a title
    lines.forEach((l, i) => parts.push([n.appendChild(el("div", (lone ? "big" : "line") + (i === 0 ? " grad" : ""), l)), i * step, "rise"]));
    if (s.sub) parts.push([n.appendChild(el("div", "sub", s.sub)), lines.length * step + .2, "rise"]);
  } else if (s.type === "cards") {
    if (s.text) parts.push([n.appendChild(el("div", "line", s.text)), 0, "rise"]);
    const box = n.appendChild(el("div", "cards"));
    const step = Math.min(.25, (s.seconds * .45) / Math.max(1, (s.items || []).length));
    (s.items || []).forEach((it, i) => parts.push([box.appendChild(el("div", "card", it)), .35 + i * step, "pop"]));
  } else if (s.type === "stat") {
    const m = String(s.text).match(/^(\D*?)(\d[\d,]*\.?\d*)(.*)$/);
    const pct = m && /^\s*%/.test(m[3]) && parseFloat(m[2]) <= 100;  // "72%": a gauge ring around the number
    const holder = pct ? n.appendChild(el("div", "ring")) : n;
    const big = holder.appendChild(el("div", "num grad", s.text));
    if (pct) {
      const g = svg("svg", { viewBox: "0 0 100 100" }, holder), Cr = 2 * Math.PI * 44;
      svg("circle", { cx: 50, cy: 50, r: 44, fill: "none", "stroke-width": 6 }, g).style.stroke = tone.card;
      const arc = svg("circle", { cx: 50, cy: 50, r: 44, fill: "none", "stroke-width": 6, "stroke-linecap": "round", transform: "rotate(-90 50 50)", "stroke-dasharray": Cr }, g);
      arc.style.stroke = tone.a[1];
      holder._f = (p) => arc.setAttribute("stroke-dashoffset", Cr * (1 - parseFloat(m[2]) / 100 * ease(p)));
      holder._dur = Math.max(.8, s.seconds * .45);
      parts.push([holder, 0, "fn"]);
    }
    parts.push([pct ? holder : big, 0, "pop"]);
    if (m) big._count = { pre: m[1], to: parseFloat(m[2].replace(/,/g, "")), dec: (m[2].split(".")[1] || "").length, post: m[3], comma: m[2].includes(",") };
    if (s.sub) parts.push([n.appendChild(el("div", "sub", s.sub)), .35, "rise"]);
  } else if (s.type === "shot") {
    STORY.shot(s, n, parts);
  } else if (s.type === "endcard") {
    STORY.card(s, n, parts);
  } else if (s.type === "bars") {
    head(n, parts, s);
    const box = n.appendChild(el("div", "chart"));
    const max = Math.max(...s.data.map((d) => d.value), 1e-9), d0 = decs(s.data.map((d) => d.value));
    const step = Math.min(.25, s.seconds * .3 / s.data.length);
    s.data.forEach((d, i) => {
      const row = box.appendChild(el("div", "brow"));
      row.appendChild(el("div", "blabel", d.label));
      const bar = row.appendChild(el("div", "btrack")).appendChild(el("div", "bar"));
      const val = row.appendChild(el("div", "bval"));
      row._f = (p) => { const q = ease(p); bar.style.width = (d.value / max * 100 * q) + "%"; val.textContent = num(d.value * q, d0) + (s.unit || ""); row.style.opacity = clamp(p * 4); };
      parts.push([row, .3 + i * step, "fn"]);
    });
    foot(n, parts, s, .5 + s.data.length * step + .6);
  } else if (s.type === "donut") {
    head(n, parts, s);
    const wrap = n.appendChild(el("div", "donut")), ring = wrap.appendChild(el("div", "dwrap"));
    const g = svg("svg", { viewBox: "0 0 100 100" }, ring), Cr = 2 * Math.PI * 38, cols = PALETTE();
    svg("circle", { cx: 50, cy: 50, r: 38, fill: "none", "stroke-width": 16 }, g).style.stroke = tone.card;
    const total = s.data.reduce((a, d) => a + d.value, 0) || 1;
    const segs = s.data.map((d, i) => { const c = svg("circle", { cx: 50, cy: 50, r: 38, fill: "none", "stroke-width": 16, transform: "rotate(-90 50 50)" }, g); c.style.stroke = cols[i % cols.length]; return c; });
    const center = ring.appendChild(el("div", "dcenter"));
    const legend = wrap.appendChild(el("div", "legend"));
    s.data.forEach((d, i) => {
      const li = legend.appendChild(el("div", "")), dot = li.appendChild(el("span", "dot"));
      dot.style.background = cols[i % cols.length];
      li.appendChild(el("span", "", `${d.label} ${Math.round(d.value / total * 100)}%`));
      parts.push([li, .5 + i * .15, "rise"]);
    });
    ring._f = (p) => {
      const q = ease(p); let cum = 0;
      segs.forEach((c, i) => { const f = s.data[i].value / total * q; c.setAttribute("stroke-dasharray", `${Math.max(0, f * Cr - .8)} ${Cr}`); c.setAttribute("stroke-dashoffset", -cum * Cr); cum += f; });
      center.textContent = Math.round(s.data[0].value / total * 100 * q) + "%";
      center.style.color = cols[0];
    };
    ring._dur = 1.4;
    parts.push([ring, .2, "fn"]);
    foot(n, parts, s, 1.2 + s.data.length * .15);
  } else if (s.type === "line") {
    head(n, parts, s);
    const W = 1000, H = VERT ? 900 : 420, P = 40, k = s.data.length, box = n.appendChild(el("div", "linebox"));
    box.style.aspectRatio = `${W} / ${H}`;  // a phone screen: a taller chart
    const g = svg("svg", { viewBox: `0 0 ${W} ${H}` }, box), vals = s.data.map((d) => d.value), d0 = decs(vals);
    const mx = Math.max(...vals), mn = Math.min(0, ...vals);
    const pts = vals.map((v, i) => [P + i * (W - 2 * P) / Math.max(1, k - 1), H - P - (v - mn) / ((mx - mn) || 1) * (H - 2 * P)]);
    for (let j = 0; j < 4; j++) svg("line", { x1: P, x2: W - P, y1: P + j * (H - 2 * P) / 3, y2: P + j * (H - 2 * P) / 3, "stroke-width": 2, opacity: .25 }, g).style.stroke = tone.mute;
    const dstr = "M" + pts.map((q) => q.join(",")).join(" L");
    const area = svg("path", { d: `${dstr} L${pts[k - 1][0]},${H - P} L${pts[0][0]},${H - P} Z` }, g); area.style.fill = tone.a[1];
    const path = svg("path", { d: dstr, fill: "none", "stroke-width": 8, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
    path.style.stroke = tone.a[0];
    const len = path.getTotalLength(); path.setAttribute("stroke-dasharray", len);
    const dots = pts.map((q) => { const c = svg("circle", { cx: q[0], cy: q[1], r: 0 }, g); c.style.fill = tone.a[2]; return c; });
