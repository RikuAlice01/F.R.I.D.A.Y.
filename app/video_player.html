<!doctype html>
<!-- §104 FRIDAY's storyboard player: motion graphics in CSS + JS, every frame a pure function of time (window.T(t)),
     after the /brag skill (github.com/latent-spaces/brag, MIT). video.py injects the storyboard as SB and captures each
     frame in Edge headless. Text from the model goes in with textContent only. -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: P; src: url(/__friday/fonts/Prompt-Regular.ttf); font-weight: 400; }
@font-face { font-family: P; src: url(/__friday/fonts/Prompt-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: P; src: url(/__friday/fonts/Prompt-Bold.ttf); font-weight: 700; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
  font-family: P, "Leelawadee UI", Tahoma, sans-serif; }
#bg, .scene { position: absolute; inset: 0; }
.blob { position: absolute; border-radius: 50%; filter: blur(calc(var(--u) * 9)); opacity: .35; }
.scene { display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  padding: calc(var(--u) * 8); gap: calc(var(--u) * 3); }
.big, .line, .quote, .sub { text-wrap: balance; }
.big { font-weight: 700; font-size: calc(var(--u) * 11); line-height: 1.15; letter-spacing: -.01em; }
.grad { background: linear-gradient(100deg, var(--a1), var(--a2), var(--a3)); -webkit-background-clip: text;
  background-clip: text; color: transparent; padding-bottom: .08em; }
.sub { font-size: calc(var(--u) * 4.2); color: var(--mute); font-weight: 400; max-width: 90%; }
.line { font-size: calc(var(--u) * 6.4); font-weight: 600; line-height: 1.3; }
.cards { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u) * 2.4); max-width: 94%; }
.card { background: var(--card); border-radius: calc(var(--u) * 2.4); padding: calc(var(--u) * 2.4) calc(var(--u) * 3.6);
  font-size: calc(var(--u) * 4.4); font-weight: 600; box-shadow: 0 calc(var(--u) * .8) calc(var(--u) * 3) rgba(0,0,0,.12); }
.card::before { content: ""; display: inline-block; width: .5em; height: .5em; border-radius: 50%; margin-right: .5em;
  vertical-align: .12em; background: linear-gradient(135deg, var(--a1), var(--a3)); }
.num { font-weight: 700; font-size: calc(var(--u) * 24); line-height: 1; }
.mark { font-family: Georgia, serif; font-size: calc(var(--u) * 26); line-height: .9; font-weight: 700; height: calc(var(--u) * 9); }
.quote { font-size: calc(var(--u) * 6.2); font-weight: 600; line-height: 1.35; max-width: 92%; }
.img { position: absolute; inset: 0; background-size: cover; background-position: center; }
.shade { position: absolute; inset: 0; background: linear-gradient(transparent 45%, rgba(0,0,0,.72)); }
.cap { position: absolute; left: 0; right: 0; bottom: calc(var(--u) * 9); padding: 0 calc(var(--u) * 7); color: #fff; }
.cap .line { text-shadow: 0 2px 12px rgba(0,0,0,.4); }
.cap .sub { color: rgba(255,255,255,.85); margin: calc(var(--u) * 1.5) auto 0; }
.orb { width: calc(var(--u) * 14); height: calc(var(--u) * 14); border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff8, transparent 45%), linear-gradient(135deg, var(--a1), var(--a2), var(--a3)); }
.pill { font-size: calc(var(--u) * 3.6); font-weight: 600; padding: calc(var(--u) * 1.2) calc(var(--u) * 3.4); border-radius: 999px;
  background: var(--ink); color: var(--bg); }
.caps .big, .caps .line, .caps .card { text-transform: uppercase; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#bars { position: absolute; inset: 0; pointer-events: none; }
#bars::before, #bars::after { content: ""; position: absolute; left: 0; right: 0; height: var(--bar, 0); background: #000; }
#bars::before { top: 0; } #bars::after { bottom: 0; }
</style></head>
<body><div id="bg"></div><div id="stage"></div><div id="bars"></div><div id="flash"></div>
<script>
const SB = /*STORYBOARD*/{};
// tone = colors + how scenes move (after the /brag tone table)
const TONES = {
  default:   { bg: "#ffffff", ink: "#1d1d1f", mute: "#6e6e73", card: "#f4f4f7", a: ["#00b8e6", "#6a5cff", "#c04fd8"], inT: .55, outT: .3, blob: 1 },
  polished:  { bg: "#f7f5f0", ink: "#1a1a1a", mute: "#77736a", card: "#ffffff", a: ["#1a1a1a", "#8a6d3b", "#b8975a"], inT: .9, outT: .5, blob: .5 },
  cinematic: { bg: "#07080c", ink: "#f4f1ea", mute: "#a9a59b", card: "#15171f", a: ["#f7d58b", "#e8a54b", "#c96b2c"], inT: 1.1, outT: .5, blob: .7, bars: true },
  chaotic:   { bg: "#fff200", ink: "#111111", mute: "#333333", card: "#ffffff", a: ["#ff1f6d", "#7a00ff", "#00c2ff"], inT: .18, outT: .08, blob: 1.6, caps: true, flash: true },
  deadpan:   { bg: "#ffffff", ink: "#111111", mute: "#8a8a8a", card: "#f2f2f2", a: ["#111111", "#111111", "#111111"], inT: 1.0, outT: .6, blob: 0 },
  "app-store": { bg: "#f2f3f7", ink: "#1d1d1f", mute: "#6e6e73", card: "#ffffff", a: ["#0a84ff", "#5e5ce6", "#bf5af2"], inT: .5, outT: .3, blob: .6 },
  dark:      { bg: "#0b0c11", ink: "#e8e8ee", mute: "#8a8fa3", card: "#16181f", a: ["#3ee6ff", "#6a5cff", "#ff4fd8"], inT: .55, outT: .3, blob: 1 },
};
const tone = Object.assign({}, TONES[SB.tone] || TONES.default);
const C = SB.colors || {};
if (C.bg) tone.bg = C.bg; if (C.ink) tone.ink = C.ink; if (C.accent) tone.a = [C.accent, C.accent, tone.a[2]];
const root = document.documentElement.style;
root.setProperty("--bg", tone.bg); root.setProperty("--ink", tone.ink); root.setProperty("--mute", tone.mute);
root.setProperty("--card", tone.card);
tone.a.forEach((c, i) => root.setProperty("--a" + (i + 1), c));
root.setProperty("--u", Math.min(innerWidth, innerHeight) / 100 * (innerHeight > innerWidth ? 1.15 : 1) + "px");  // vertical: a phone held close
if (tone.caps) document.body.classList.add("caps");

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);                       // out-cubic
const back = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
// Thai has no spaces between words, so the browser may break a name in two ("กาแฟดอย / ช้าง"): the writer's own spaces
// are the break points — each short chunk stays whole (text nodes only, never HTML)
const el = (tag, cls, text) => {
  const e = document.createElement(tag); if (cls) e.className = cls;
  if (text != null) for (const w of String(text).split(/(\s+)/)) {
    if (w && !/\s/.test(w) && w.length <= 16) { const k = document.createElement("span"); k.style.whiteSpace = "nowrap"; k.textContent = w; e.appendChild(k); }
    else if (w) e.appendChild(document.createTextNode(w));
  }
  return e;
};

// background: soft blobs drifting as a function of t
const bg = document.getElementById("bg"), blobs = [];
for (let i = 0; i < 3; i++) {
  const b = el("div", "blob"); b.style.background = tone.a[i]; b.style.width = b.style.height = (38 + i * 10) + "vmax";
  if (!tone.blob) b.style.display = "none"; bg.appendChild(b); blobs.push(b);
}
if (tone.bars) document.getElementById("bars").style.setProperty("--bar", "9vh");

// build every scene once; T(t) only moves things
const stage = document.getElementById("stage"), scenes = [], images = [];
for (const s of SB.scenes) {
  const n = el("div", "scene"), parts = [];  // parts: [element, delay, kind]
  if (s.type === "title" || s.type === "outro") {
    if (s.type === "outro") parts.push([n.appendChild(el("div", "orb")), 0, "pop"]);
    parts.push([n.appendChild(el("div", "big grad", s.text)), .1, "rise"]);
    if (s.sub) parts.push([n.appendChild(el("div", "sub", s.sub)), .45, "rise"]);
    if (s.type === "outro" && s.items && s.items[0]) parts.push([n.appendChild(el("div", "pill", s.items[0])), .8, "pop"]);
  } else if (s.type === "lines") {
    const lines = [s.text, ...(s.items || [])].filter(Boolean);
    const step = Math.min(.9, (s.seconds * .55) / Math.max(1, lines.length));
    const lone = lines.length === 1;  // one line on its own: as big as a title
    lines.forEach((l, i) => parts.push([n.appendChild(el("div", (lone ? "big" : "line") + (i === 0 ? " grad" : ""), l)), i * step, "rise"]));
    if (s.sub) parts.push([n.appendChild(el("div", "sub", s.sub)), lines.length * step + .2, "rise"]);
  } else if (s.type === "cards") {
    if (s.text) parts.push([n.appendChild(el("div", "line", s.text)), 0, "rise"]);
    const box = n.appendChild(el("div", "cards"));
    const step = Math.min(.25, (s.seconds * .45) / Math.max(1, (s.items || []).length));
    (s.items || []).forEach((it, i) => parts.push([box.appendChild(el("div", "card", it)), .35 + i * step, "pop"]));
  } else if (s.type === "stat") {
    const m = String(s.text).match(/^(\D*?)(\d[\d,]*\.?\d*)(.*)$/);
    const num = n.appendChild(el("div", "num grad", s.text));
    parts.push([num, 0, "pop"]);
    if (m) num._count = { pre: m[1], to: parseFloat(m[2].replace(/,/g, "")), dec: (m[2].split(".")[1] || "").length, post: m[3], comma: m[2].includes(",") };
    if (s.sub) parts.push([n.appendChild(el("div", "sub", s.sub)), .35, "rise"]);
  } else if (s.type === "quote") {
    parts.push([n.appendChild(el("div", "mark grad", "“")), 0, "pop"]);
    const q = n.appendChild(el("div", "quote", s.text)); q._type = Array.from(s.text); parts.push([q, .2, "type"]);
    if (s.sub) parts.push([n.appendChild(el("div", "sub", "— " + s.sub)), .3 + Math.min(2.2, s.text.length * .035), "rise"]);
  } else if (s.type === "image") {
    const im = n.appendChild(el("div", "img")); im.style.backgroundImage = `url("${encodeURI(s.image)}")`; images.push(s.image);
    n.appendChild(el("div", "shade"));
    const cap = n.appendChild(el("div", "cap"));
    parts.push([im, 0, "kenburns"]);
    if (s.text) parts.push([cap.appendChild(el("div", "line", s.text)), .3, "rise"]);
    if (s.sub) parts.push([cap.appendChild(el("div", "sub", s.sub)), .6, "rise"]);
  }
  stage.appendChild(n);
  scenes.push({ s, n, parts });
}
// wait for fonts and every image before the first frame
window.READY = Promise.all([document.fonts.ready, ...images.map((src) => new Promise((ok) => {
  const i = new Image(); i.onload = i.onerror = ok; i.src = src; }))]);

function fmt(c, x) {
  let v = (c.to * x).toFixed(c.dec);
  if (c.comma) v = Number(v).toLocaleString("en-US", { minimumFractionDigits: c.dec, maximumFractionDigits: c.dec });
  return c.pre + v + c.post;
}

window.T = function (t) {
  blobs.forEach((b, i) => {
    const a = t * (.11 + i * .05) + i * 2.1;
    b.style.left = (50 + 38 * Math.cos(a) - 20 - i * 5) + "%";
    b.style.top = (50 + 30 * Math.sin(a * 1.3) - 25) + "%";
  });
  let flash = 0;
  for (const { s, n, parts } of scenes) {
    const L = t - s.start;
    if (L < 0 || L >= s.seconds) { n.style.display = "none"; continue; }
    n.style.display = "flex";
    const out = clamp((L - (s.seconds - tone.outT)) / tone.outT);  // old content out, then the next one comes in
    n.style.opacity = 1 - ease(out);
    n.style.transform = `translateY(${-ease(out) * 2}vmin)`;
    if (tone.flash) flash = Math.max(flash, 1 - clamp(L / .12));
    for (const [e, delay, kind] of parts) {
      const p = (L - delay) / tone.inT;
      if (kind === "rise") { e.style.opacity = ease(p); e.style.transform = `translateY(${(1 - ease(p)) * 4}vmin)`; }
      else if (kind === "pop") { e.style.opacity = clamp(p * 3); e.style.transform = `scale(${.6 + .4 * back(p)})`; }
      else if (kind === "type") { const k = Math.round(e._type.length * clamp((L - delay) / Math.min(2.2, e._type.length * .035))); e.textContent = e._type.slice(0, k).join(""); }
      else if (kind === "kenburns") { e.style.transform = `scale(${1.04 + .1 * (L / s.seconds)})`; e.style.opacity = ease(L / .5); }
      if (e._count) e.textContent = fmt(e._count, ease((L - delay) / Math.max(.8, s.seconds * .45)));
    }
  }
  document.getElementById("flash").style.opacity = flash * .85;
};
window.T(0);
</script></body></html>
